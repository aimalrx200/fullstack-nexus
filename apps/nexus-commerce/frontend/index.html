<!-- apps/nexus-commerce/frontend/index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ⚡ Inline theme initial script (prevents theme flash on reload) -->
    <script>
      (function () {
        try {
          const savedTheme = localStorage.getItem("nexus_theme") || "system";
          const prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          const isDark =
            savedTheme === "dark" || (savedTheme === "system" && prefersDark);

          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Nexus Commerce — Enterprise Storefront & Real-Time Engine</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body
    class="bg-surface-app text-text-main antialiased selection:bg-brand-primary selection:text-white"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
